  browsers:
    - id: BROWSER-EDGE
      name: Microsoft Edge
      version: 155.0.4283.45
    - id: BROWSER-CHROME
      name: Google Chrome
      version: 154.0.8037.93
    - id: BROWSER-PLAYWRIGHT
      name: Playwright browser matrix
      version: 1.61.1
  baseline:
    npmCi: passed-with-registry-host-replacement
    lint: passed
    unitTests: 52-passed
