validation:
  contract:
    id: VAL-CONTRACT
    checks:
      - required-sections
      - unique-stable-ids
      - locale-mappings
      - curriculum-mappings
      - readme-key-declarations
      - artifact-path-status
      - public-derivative-exclusion-hashes-and-paths
      - aligned-pptx-structure
      - speaker-notes-and-claim-ids
      - pdf-page-metadata-language-tags-bookmarks-links-and-text
  automated:
    - id: VAL-DECK-GENERATE
      command: npm run generate:decks
    - id: VAL-DECK-STRUCTURE
      command: npm run check:release -- --scope deck
    - id: VAL-DECK-RENDER
      command: npm run check:deck-render
    - id: VAL-LINT
      command: npm run lint
    - id: VAL-UNIT
      command: npm run test
    - id: VAL-BUILD
      command: npm run build
    - id: VAL-E2E-FOCUSED
      command: npm run test:e2e -- --grep "confirmation|statuts"
  manual:
    - id: VAL-FACILITATOR-EDITING
      status: pending
      reason: PowerPoint was not locally discoverable for an ordinary facilitator edit-and-save check.
    - id: VAL-PUBLICATION-APPROVAL
      status: pending
      reason: Pages subpath is prepared; dependency audit resolution and explicit human release approval are required before deployment.
    - id: VAL-PRESENTATION-ACCESSIBILITY
      status: pending
      reason: PowerPoint Accessibility Checker and human reading-order review require manual execution.
    - id: VAL-PDF-SCREEN-READER
      status: pending
      reason: Local structural checks cannot prove assistive-technology reading order or tag quality.
    - id: VAL-BILINGUAL-FLUENCY
      status: pending
      reason: Automated alignment cannot approve fluent English and Canadian French terminology or meaning.