    publicInstructions: manual-dispatch-and-explicit-release-approval-required
    releaseApproval: pending
  provenance:
    kind: sanitized-clean-history-derivative
    note: Adapted from an internal learning prototype; historical source PDFs, internal planning, local configuration, and original Git history are intentionally excluded.
  facilitatorEditing:
    sourceFormat: pptx
    status: pending-manual-validation
    powerPointLocallyDiscoverable: true
    sourcesIncludeSpeakerNotes: true
    decisionOnFailure: reopen-deck-source-only
  presentation:
    aspectRatio: 16:9
    slideCount: 35
    sourceGenerator: scripts/generate-course-decks.mjs
    pdfExport: deterministic-node-writer
    pdfAccessibilityScope: structure-language-bookmarks-links-and-extractable-text
    manualAccessibilityStatus: pending

testedEnvironment:
  capturedAt: 2026-10-14
  operatingSystem: Windows
  architecture: arm64
  node: v26.7.0
  npm: 12.0.1
  vscode: 1.141.0
  githubCopilotExtension:
    version: not-locally-discoverable
