  historicalPdfPolicy: excluded-from-public-derivative
  retentionDurationPolicy: excluded-until-live-verification
  readmeSectionKeys:
    - purpose
    - application-and-lab
    - prerequisites
    - installation
    - commands
    - architecture
    - routes
    - local-data-and-privacy
    - static-export-and-hosting
    - accessibility
    - learning-assets
    - contributing
    - freshness
    - known-caveats
